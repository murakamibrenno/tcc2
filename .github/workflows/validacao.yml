name: Validacao tecnica TCC2
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy>=1.24,<3'
      - run: python -m unittest discover -s piloto_tfidf/tests -v
      - run: python -m compileall -q piloto_tfidf
  interface:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aplicacao_mockup
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: aplicacao_mockup/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
